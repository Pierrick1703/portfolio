<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pierrick Cottin — Portfolio</title>
    <meta name="description" content="Portfolio de Pierrick Cottin, développeur full-stack Data & IA : projets, compétences et parcours." />
    <meta property="og:title" content="Pierrick Cottin — Portfolio" />
    <meta property="og:description" content="Développeur full-stack Data & IA : projets, compétences et parcours." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Appliqué avant le rendu pour éviter un flash de mauvais thème.
      (function () {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
